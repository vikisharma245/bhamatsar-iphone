<script>
var $=function(i){return document.getElementById(i)},LS=localStorage,CFG=window.CFG||{},API=CFG.API||'';
function g(k,d){try{var v=LS.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function sv(k,v){try{LS.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var PHC={'क':'k','ख':'k','ग':'g','घ':'g','ङ':'n','च':'c','छ':'c','ज':'j','झ':'j','ञ':'n','ट':'t','ठ':'t','ड':'d','ढ':'d','ण':'n','त':'t','थ':'t','द':'d','ध':'d','न':'n','प':'p','फ':'f','ब':'b','भ':'b','म':'m','य':'y','र':'r','ल':'l','व':'b','श':'s','ष':'s','स':'s','ह':'h','ळ':'l'},PHV={'अ':'a','आ':'a','इ':'i','ई':'i','उ':'u','ऊ':'u','ए':'e','ऐ':'e','ओ':'o','औ':'o','ऋ':'ri','ा':'a','ि':'i','ी':'i','ु':'u','ू':'u','े':'e','ै':'e','ो':'o','ौ':'o','ृ':'ri','ॅ':'e','ॉ':'o','ं':'n','ँ':'n'};
function phw(w){w=String(w||'').toLowerCase().replace(/ड़/g,'ड़').replace(/ढ़/g,'ढ़');var o='',i,c,n;
 for(i=0;i<w.length;i++){c=w[i];if(c==='ड़'||c==='ढ़'){o+='r';c='र'}else if(PHC[c]){if(w[i+1]==='़'){o+=(c==='ड'||c==='ढ')?'r':PHC[c];i++}else o+=PHC[c]}else{if(c==='ं'||c==='ँ'){o+=/[पफबभम]/.test(w[i+1]||'')?'m':'n'}else if(PHV[c])o+=PHV[c];else if(/[a-z]/.test(c))o+=c;continue}
  n=w[i+1];if(!(n&&(PHV[n]&&!/[अआइईउऊएऐओऔऋ]/.test(n)&&n!=='ं'&&n!=='ँ'||n==='्')))o+='a';}
 w=o.replace(/a(?=[^a-z]|$)/g,'');if(!w)return '';
 w=w.replace(/ph/g,'f').replace(/([kgcjtdpbs])h+/g,'$1').replace(/z/g,'j').replace(/q/g,'k').replace(/x/g,'ks').replace(/ck/g,'k');
 w=w.replace(/([^aeiouy])w(?=[^aeiouy]|$)/g,'$1u').replace(/[wv]/g,'b').replace(/y$/,'i');
 var f=/^[aeiou]/.test(w)?'a':'';w=w.replace(/[aeiou]+/g,'').replace(/(.)\1+/g,'$1');return f+w}
function phx(s){return String(s||'').split(/\s+/).map(phw).filter(Boolean).join('')}
function phKey(v){return phx(v[3])+' '+phx(v[4])+'|'+phx(v[5])+' '+phx(v[6])}
var PHSTOP=/^(पुत्र|पुत्री|पिता|पति|पत्नी|बेटा|बेटी|का|की|के|s\/o|d\/o|w\/o|so|do|wo|son|of|father|husband|wife)$/i;
function phVar(pt){var o=[pt];for(var i=0;i+1<pt.length;i++)o.push(pt.slice(0,i).concat([pt[i]+pt[i+1]],pt.slice(i+2)));return o}
function phScore(pt,key){var p=key.split('|'),N=p[0],F=p[1]||'',NW=N.split(' '),vs=phVar(pt),best=0;
 var st=function(x){var r=0;NW.forEach(function(w){if(w&&w.indexOf(x)===0)r=Math.max(r,x.length/w.length)});return r};
 vs.forEach(function(t){var s=0,s0=st(t[0]);if(t.every(function(x){return key.indexOf(x)>=0})){s=2+(s0?1+s0/2:N.indexOf(t[0])>=0?0.5:0);if(t.length>1&&t.slice(1).every(function(x){return F.indexOf(x)>=0}))s+=1}
  else if(t.length>=2&&s0){var h=t.slice(1).filter(function(x){return F.indexOf(x)>=0}).length;if(h>=t.length-2)s=0.5+s0/4+0.2*h/(t.length-1)}
  if(s>best)best=s});return best}
function phToks(q){var t=String(q||'').trim().split(/\s+/).filter(function(x){return !PHSTOP.test(x)});if(t.some(function(x){return /\d/.test(x)}))return null;t=t.map(phw).filter(Boolean);return t.length&&t.every(function(x){return x.length>=2})?t:null}
function norm(x){return String(x||'').toLowerCase().replace(/[़ँं‌‍.]/g,'').replace(/\s+/g,' ')}
function b64(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
async function dec(blob,key){
 var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(key),'PBKDF2',false,['deriveKey']);
 var k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(blob.salt),iterations:100000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(blob.iv)},k,b64(blob.ct));
 return JSON.parse(await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).text())}
var VIEW=false,KEY='',ID='',NAME='',D=null,IX=[],FX=null,ST=g('bh_st',{}),PH=g('bh_ph',{}),NT=g('bh_nt',{}),FAM={},MYS={},SC=g('bh_sc',''),SCW=null,DV=0,EXP=0,FIL='',LIM=100,syncing=false,tm,stm,lastErr='';
function wipe(msg){['bh_code','bh_name','bh_blob','bh_st','bh_q','bh_ph','bh_pq','bh_nt','bh_nq','bh_sq','bh_my','bh_av','bh_sc','bh_rl','bh_since','bh_ui','bh_uiv','bh_sync'].forEach(function(k){LS.removeItem(k)});ST={};showLogin(msg||'')}
function showLogin(msg){$('app').classList.add('hid');$('lg').classList.remove('hid');$('le').textContent=msg||'';LS.setItem('bh_boot','1')}
async function loadBlob(){var st=g('bh_blob',null),bu=null;try{var r=await fetch('data.enc.json');if(r.ok)bu=await r.json()}catch(e){}
 var b=(st&&(!bu||st.ver>=bu.ver))?st:bu;
 if(!b&&API){var r2=await post({a:'data',id:ID});if(r2&&r2.revoked)throw new Error('बंद');if(r2&&r2.bound)throw new Error('दूसरे फ़ोन');if(r2&&r2.ok&&r2.blob)b=typeof r2.blob==='string'?JSON.parse(r2.blob):r2.blob}
 if(!b)throw new Error('पहली बार नेट चाहिए — नेट चालू करके फिर कोशिश करें');return b}
async function start(code,name,fresh){
 var p=String(code||'').trim().toUpperCase(),i=p.indexOf('-');if(i<1||i>=p.length-1){showLogin('कोड सही नहीं (जैसे AB12CD-D01)');return}
 KEY=p.slice(0,i);ID=p.slice(i+1);RL=fresh?ID.charAt(0):String(g('bh_rl',ID.charAt(0)));VIEW=RL==='S';NAME=String(name||'').trim();
 if(!NAME){showLogin('अपना नाम लिखें');return}
 if(fresh&&API){var h=null;try{h=await post({a:'hello',id:ID})}catch(e){}
  if(!h){showLogin('पहली बार लॉगिन के लिए नेट चाहिए — नेट चालू करके फिर दबाएँ');return}
  if(h.revoked){showLogin('यह कोड गलत है या बंद है');return}
  if(h.rl){RL=h.rl;VIEW=RL==='S';sv('bh_rl',RL)}
  if(h.bound){showLogin('यह ID किसी दूसरे फ़ोन में चालू है — मास्टर से बात करें');return}
  setSc(h.sc)}
 try{var b=await loadBlob();EXP=b.exp||0;
  if(EXP&&Date.now()>EXP){wipe('चुनाव की अवधि समाप्त — ऐप बंद है');return}
  D=await dec(b,KEY);DV=b.ver}catch(e){showLogin(/नेट/.test(e.message)?e.message:/दूसरे फ़ोन/.test(e.message)?'यह ID किसी दूसरे फ़ोन में चालू है':(/बंद/.test(e.message)?'यह कोड बंद है':'कोड गलत है'));return}
 sv('bh_code',p);sv('bh_name',NAME);init();if(fresh)sv('bh_blob',b);schedule(300)}
var CATN={ok:'हमारा',suspense:'सस्पेंस',RAMLAL:'रामलाल',RAMESHWAR:'रामेश्वर',death:'मृत्यु'};
var RL='';function HIDE(){return /^[DV]/i.test(RL||ID)}
function catOf(sd){return String(sd[0]||'')}
function noteTxt(sd){var n=String(sd[9]||''),p=n.split(' · ');if(CATN[p[0]]!==undefined||p[0]===catOf(sd))p.shift();var seen={},r=p.filter(function(x){x=x.trim();if(!x||seen[x])return false;seen[x]=1;return true}).join(' · ');var c=catOf(sd);return HIDE()?r:((c?(CATN[c]||c):'')+(c&&r?' · ':'')+r)}
function applyNT(){D.s=D.s||{};Object.keys(NT).forEach(function(k){var o;try{o=JSON.parse(NT[k][0])}catch(e){return}var s=D.s[k]=D.s[k]||['','','','','','','','','',''];if('m' in o)s[2]=o.m;if('s' in o)s[1]=o.s;if('g' in o){s[7]=o.g;s[5]=''}if('c' in o){var rest=String(s[9]||'').split(' · ');if(CATN[rest[0]]!==undefined||rest[0]===s[0])rest.shift();s[0]=o.c;s[9]=[o.c].concat(rest).join(' · ')}})}
function init(){
 applyNT();
 MYS={};g('bh_my',[]).forEach(function(x){MYS[x[0]+'-'+x[1]]=1});
 PH=g('bh_ph',{});FAM={};D.v.forEach(function(v){if(v[10]===2)return;var f=v[0]+'|'+String(v[2]).split(' ')[0];FAM[f]=(FAM[f]||0)+1});
 var mm={},sb={};Object.keys(D.s||{}).forEach(function(k){var x=D.s[k];if(x[2])mm[x[2]]=1;if(x[1])sb[x[1]]=1});
 $('fmn').innerHTML='<option value="">सारे मेन (मुखिया)</option>'+Object.keys(mm).sort().map(function(x){return '<option>'+esc(x)+'</option>'}).join('');
 $('fsb').innerHTML='<option value="">सारे सब-मुखिया</option>'+Object.keys(sb).sort().map(function(x){return '<option>'+esc(x)+'</option>'}).join('');
 FX=null;IX=D.v.map(function(v){var sd=(D.s||{})[v[0]+'-'+v[1]];return norm([v[3],v[4],v[5],v[6],v[9],sd?sd[4]:''].join(' '))});
 setSc(SC);if(SC==='M'&&!FIL)FIL='M';else if(HIDE()&&!FIL)FIL='P';var ws=[],seen={};D.v.forEach(function(v){if(!seen[v[0]]&&vis(v)){seen[v[0]]=1;ws.push(v[0])}});ws.sort(function(a,b){return a-b});
 $('w').innerHTML='<option value="">सारे वार्ड</option>'+ws.map(function(w){var b=(D.w[w]||[])[0];return '<option value="'+w+'">वार्ड '+w+(b?' (बूथ '+esc(b)+')':'')+'</option>'}).join('');
 var rs={};Object.keys(D.s||{}).forEach(function(k){var r=D.s[k][8];if(r)rs[r]=1});$('rt').innerHTML='<option value="">सारे रूट / गाँव</option>'+Object.keys(rs).sort().map(function(r){return '<option>'+esc(r)+'</option>'}).join('');
 $('hd').textContent=D.vill||CFG.TITLE;$('lg').classList.add('hid');$('app').classList.remove('hid');
 chips();run();stat();LS.setItem('bh_boot','1')}
var CH=[['','सब'],['P','⭐ ज़रूरी बचे'],['R','बचे हुए'],['L','🚗 लाए'],['V','🗳 वोट डाला']];
function chips(){var n=Object.keys(MYS).length,L=n?[['M','🙋 मेरे लोग ('+n+')']].concat(CH):CH;if(!n&&FIL==='M')FIL='';$('chips').innerHTML=L.map(function(c){return '<span class="chip'+(FIL===c[0]?' on':'')+'" data-f="'+c[0]+'">'+c[1]+'</span>'}).join('')}
function key(v){return v[0]+'-'+v[1]}
function setSc(s){SC=String(s||'');sv('bh_sc',SC);SCW=null;var m=SC.match(/^W:(.*)$/);if(m){SCW={};m[1].split(/[ ,]+/).forEach(function(x){if(x)SCW[+x]=1})}}
function vis(v){if(SC==='M')return !!MYS[key(v)];if(SCW)return !!SCW[v[0]];return true}
function stOf(v){var e=ST[key(v)];return e?e[0]:''}
function fok(v){var s=stOf(v);if(FIL==='M')return !!MYS[key(v)];if(FIL==='P'){if(v[10]===2||s==='V')return false;var c=catOf((D.s||{})[key(v)]||[]);return c==='ok'||c==='suspense'||c===''}if(v[10]===2)return !FIL;return !FIL||(FIL==='R'?s!=='V':s===FIL)}
function hno1(v){return String(v[2]).split(' ')[0].toLowerCase()}
function wok(v){if(!vis(v))return false;var hn=$('hn').value.trim().toLowerCase();if(hn&&hno1(v)!==hn)return false;var w=$('w').value,r=$('rt').value,mn=$('fmn').value,sb=$('fsb').value,sd=(D.s||{})[key(v)]||[];return (!w||v[0]==+w)&&(!r||sd[8]===r)&&(!mn||sd[2]===mn)&&(!sb||sd[1]===sb)}
function gok(v){var x=$('by').value;return !x||(x==='M'?v[8]==='पुरुष':v[8]==='महिला')}
function find(q){q=q.trim();var o=[],m;
 if(!q){if($('hn').value.trim()||$('w').value||FIL||$('rt').value||$('fmn').value||$('fsb').value){D.v.forEach(function(v){if(wok(v)&&gok(v)&&fok(v))o.push(v)})}return o}
 if((m=q.match(/^(मकान|house|h)\s*:?\s*(\S+)$/i))){D.v.forEach(function(v){if(String(v[2]).split(' ')[0]===m[2]&&wok(v)&&gok(v)&&fok(v))o.push(v)});return o}
 if(/^\d+$/.test(q)){D.v.forEach(function(v){if((v[1]==+q||String(v[2]).split(' ')[0]===q)&&wok(v)&&gok(v)&&fok(v))o.push(v)});return o}

$('mveh').onclick=async function(){if(VIEW||/^D/i.test(RL||ID)){alert('यह विकल्प वॉलंटियर / बूथ एजेंट के लिए है');return}var cur=g('bh_myveh',{});
 var n=prompt('क्या आपके घर में अपनी गाड़ी है? (अपने लोगों को खुद लाएँगे — दूसरी गाड़ी नहीं भेजी जाएगी)\n\nगाड़ी नंबर लिखें (जैसे RJ07 AB 1234)\nगाड़ी नहीं है तो खाली छोड़कर OK दबाएँ:',cur.vno||'');if(n===null)return;n=n.trim().toUpperCase();var t='';
 if(n){t=prompt('गाड़ी का प्रकार और कितने लोग बैठेंगे (जैसे: बोलेरो, 8 लोग):',cur.vtype||'');if(t===null)return;t=t.trim()}
 if(navigator.onLine===false){alert('नेट चालू करके फिर दबाएँ');return}var r=null;try{r=await post({a:'myveh',id:ID,vno:n,vtype:t?('खुद की गाड़ी · '+t):(n?'खुद की गाड़ी':'')})}catch(e){}
 if(r&&r.ok){sv('bh_myveh',{vno:n,vtype:t});alert(n?'✔ दर्ज हो गया — मास्टर को पता है कि आप अपनी गाड़ी ('+n+') से अपने लोगों को लाएँगे।':'✔ हटा दिया — अब ज़रूरत हो तो मास्टर गाड़ी भेजेगा।')}else alert((r&&r.err)||'सर्वर से जवाब नहीं मिला — फिर दबाएँ')};

async function unlock(){var b=bio();if(!b||!lockOn())return true;
 try{var a=await b.isAvailable();if(!a||!a.isAvailable)return true}catch(e){return true}
 try{await b.verifyIdentity({reason:'ऐप खोलने के लिए',title:'भामटसर सहायक',subtitle:'फ़िंगरप्रिंट / चेहरा / फ़ोन लॉक',useFallback:true,maxAttempts:3});return true}catch(e){return false}}
async function gate(c,n){$('lg').classList.add('hid');if(await unlock()){$('lk').classList.add('hid');start(c,n,false)}else{$('lk').classList.remove('hid');$('lke').textContent='खुल नहीं पाया — फिर कोशिश करें';$('lkb').onclick=function(){gate(c,n)}}}
